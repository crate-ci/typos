name: Test GitHub Action

permissions:
  contents: read

on:
  pull_request:

jobs:
  shallow:
    name: Spell Check with Typos
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install wget for Windows
      if: matrix.os == 'windows-latest'
      run: choco install wget --no-progress

    - name: Prepare file with mistakes.
      run: echo "Finallizes" > file.txt
    - name: Test force pass with mistakes
      continue-on-error: true
      uses: ./
      with:
        files: ./file.txt

    - name: Prepare file with no mistakes.
      run: echo "Finalizes" > file.txt
    - name: Test pass with no mistakes
      uses: ./
      with:
        files: ./file.txt

  deep:
    name: Spell Check with Type w/History
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: 0

    - name: Install wget for Windows
      if: matrix.os == 'windows-latest'
      run: choco install wget --no-progress

    - name: Prepare file with mistakes.
      run: echo "Finallizes" > file.txt
    - name: Test force pass with mistakes
      continue-on-error: true
      uses: ./
      with:
        files: ./file.txt

    - name: Prepare file with no mistakes.
      run: echo "Finalizes" > file.txt
    - name: Test pass with no mistakes
      uses: ./
      with:
        files: ./file.txt
